
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>冰美式 VPN 首页演示</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #0d0d0d;
      color: #fff;
    }
    .container {
      max-width: 1200px;
      margin: auto;
      padding: 4rem 2rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
    }
    .text-block {
      max-width: 500px;
    }
    .text-block h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }
    .text-block p {
      font-size: 1.1rem;
      margin-bottom: 2rem;
      color: #ccc;
    }
    .cta-button {
      background-color: #06b6d4;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
    }
    .image-block img {
      width: 320px;
      border-radius: 1rem;
    }
    .plans {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin-top: 4rem;
      flex-wrap: wrap;
    }
    .plan {
      background-color: #1a1a1a;
      padding: 2rem;
      border-radius: 1rem;
      width: 250px;
      text-align: center;
      border: 1px solid #333;
    }
    .plan h2 {
      font-size: 1.2rem;
      margin-bottom: 0.5rem;
    }
    .plan p {
      color: #bbb;
      font-size: 0.95rem;
      margin-bottom: 1rem;
    }
    .plan a {
      display: inline-block;
      background-color: #e11d48;
      color: white;
      padding: 0.5rem 1.25rem;
      border-radius: 6px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="text-block">
      <h1>冰美式 VPN，极速稳定无限设备连接</h1>
      <p>全球节点、极速穿墙、保护隐私、无日志保障</p>
      <a class="cta-button" href="#">立即获取</a>
    </div>
    <div class="image-block">
      <img src="image.png" alt="手机VPN图示">
    </div>
  </div>

  <div class="plans">
    <div class="plan">
      <h2>1 个月</h2>
      <p>¥25 / 月｜韩国 / 日本高速节点</p>
      <a href="#">立即购买</a>
    </div>
    <div class="plan">
      <h2>12 个月</h2>
      <p>¥228 / 年｜送 3 个月</p>
      <a href="#">立即购买</a>
    </div>
    <div class="plan">
      <h2>24 个月</h2>
      <p>¥388 / 2 年｜低至 ¥0.5 / 天</p>
      <a href="#">立即购买</a>
    </div>
  </div>
</body>
</html>
